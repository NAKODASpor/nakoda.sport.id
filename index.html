<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAKODA Sport - Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff;
color:#111;
overflow-x:hidden;
}

/* HEADER */
header{
position:fixed;
top:0;
width:100%;
height:60px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px 0 10px;
z-index:1000;
box-shadow:0 2px 15px rgba(0,0,0,0.05);
}

.logo-area{
display:flex;
align-items:center;
gap:10px;
}

.logo-area img{
height:48px;
width:auto;
object-fit:contain;
}

.logo-area h1{
font-size:20px;
letter-spacing:3px;
}

/* HAMBURGER */
.menu-toggle{
width:28px;
height:22px;
position:relative;
cursor:pointer;
z-index:1100;
}

.menu-toggle span{
position:absolute;
width:100%;
height:3px;
background:#000;
border-radius:3px;
transition:0.3s;
}

.menu-toggle span:nth-child(1){top:0;}
.menu-toggle span:nth-child(2){top:9px;}
.menu-toggle span:nth-child(3){bottom:0;}

.menu-toggle.active span:nth-child(1){
top:9px;
transform:rotate(45deg);
}

.menu-toggle.active span:nth-child(2){
opacity:0;
}

.menu-toggle.active span:nth-child(3){
top:9px;
transform:rotate(-45deg);
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(4px);
opacity:0;
visibility:hidden;
transition:0.4s;
z-index:900;
}

.overlay.active{
opacity:1;
visibility:visible;
}

/* NAV MENU */
.nav-menu{
position:fixed;
top:60px;
right:-100%;
width:250px;
height:100vh;
background:#ffffff;
padding:40px 30px;
transition:0.5s;
box-shadow:-5px 0 30px rgba(0,0,0,0.1);
z-index:1000;
}

.nav-menu.active{
right:0;
}

.nav-menu a{
display:block;
margin-bottom:25px;
text-decoration:none;
color:#111;
font-weight:500;
font-size:16px;
}

/* HERO */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:#111;
color:#fff;
padding-top:60px;
}

.hero h2{
font-size:60px;
letter-spacing:5px;
animation:fadeUp 1.5s ease;
}

footer{
background:#111;
color:#fff;
text-align:center;
padding:20px;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

@media(max-width:768px){
.hero h2{font-size:36px;}
}
</style>
</head>
<body>

<header>
<div class="logo-area">
<img src="https://i.ibb.co.com/5W4mggrq/20260211-154859.png">
<h1>NAKODA</h1>
</div>

<div class="menu-toggle" id="menuBtn">
<span></span>
<span></span>
<span></span>
</div>
</header>

<div class="overlay" id="overlay"></div>

<div class="nav-menu" id="navMenu">
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Store</a>
</div>

<section class="hero">
<h2>COMING SOON</h2>
</section>

<footer>
© 2026 NAKODA SPORT
</footer>

<script>
const menuBtn = document.getElementById("menuBtn");
const navMenu = document.getElementById("navMenu");
const overlay = document.getElementById("overlay");

menuBtn.addEventListener("click",()=>{
menuBtn.classList.toggle("active");
navMenu.classList.toggle("active");
overlay.classList.toggle("active");
});

overlay.addEventListener("click", closeMenu);

function closeMenu(){
menuBtn.classList.remove("active");
navMenu.classList.remove("active");
overlay.classList.remove("active");
}
</script>

</body>
</html>
